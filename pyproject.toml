[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iron-goblin"
version = "0.1.0"
description = "Deterministic strength workout tracker for OpenClaw"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["typer>=0.16,<1"]

[project.optional-dependencies]
hosted = ["httpx>=0.28,<1", "mcp>=1.30,<2", "uvicorn>=0.34,<1"]
sheets = ["google-api-python-client>=2.170,<3", "google-auth>=2.40,<3"]
dev = [
  "bandit>=1.8,<2",
  "mypy>=1.15,<2",
  "pre-commit>=4.2,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=6.1,<7",
  "ruff>=0.11,<1",
]

[project.scripts]
gym = "gym_tracker.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["gym_tracker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "C4", "DTZ", "PT", "RUF", "PERF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
packages = ["gym_tracker"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=gym_tracker --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.bandit]
exclude_dirs = ["tests"]
